<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <meta name="description" content="Formulario de registro de estudiantes">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <div class="header">
                <h1>Registro Estudiantil</h1>
                <p>Ingresa tus datos para completar la inscripción</p>
            </div>
            
            <form id="registroForm">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="El nombre solo debe contener letras y espacios">
                    </div>
                    
                    <div class="form-group">
                        <label for="ci">Cédula de Identidad (CI)</label>
                        <input type="text" id="ci" name="ci" required placeholder="Ej: 1234567">
                    </div>

                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" required placeholder="Ej: 20" min="16" max="100">
                    </div>

                    <div class="form-group">
                        <label for="carrera">Carrera</label>
                        <div class="select-wrapper">
                            <select id="carrera" name="carrera" required>
                                <option value="" disabled selected>Selecciona tu carrera</option>
                                <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                                <option value="Administración de Empresas">Administración de Empresas</option>
                                <option value="Derecho">Derecho</option>
                                <option value="Medicina">Medicina</option>
                                <option value="Arquitectura">Arquitectura</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="semestre">Semestre</label>
                        <div class="select-wrapper">
                            <select id="semestre" name="semestre" required>
                                <option value="" disabled selected>Selecciona un semestre</option>
                                <option value="1">1er Semestre</option>
                                <option value="2">2do Semestre</option>
                                <option value="3">3er Semestre</option>
                                <option value="4">4to Semestre</option>
                                <option value="5">5to Semestre</option>
                                <option value="6">6to Semestre</option>
                                <option value="7">7mo Semestre</option>
                                <option value="8">8vo Semestre</option>
                                <option value="9">9no Semestre</option>
                                <option value="10">10mo Semestre</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                    </div>

                    <div class="form-group">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" required placeholder="Ej: Santa Cruz">
                    </div>

                    <div class="form-group">
                        <label for="domicilio">Domicilio</label>
                        <input type="text" id="domicilio" name="domicilio" required placeholder="Ej: Av. Principal 123">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">Registrar Estudiante</span>
                        <div class="spinner" id="spinner"></div>
                    </button>
                    
                    <button type="reset" class="reset-btn">
                        <span class="btn-text">Limpiar</span>
                    </button>
                </div>
            </form>
            
            <div id="messageBox" class="message-box hidden"></div>
        </div>
    </div>
    
    <script src="/app.js"></script>
</body>
</html>
